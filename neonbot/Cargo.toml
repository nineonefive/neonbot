[package]
name = "neonbot"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
cfg-if = "1.0.4"
chrono = "0.4.44"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
env_logger = "0.11.10"
moka = { version = "0.12.15", features = ["future"] }
poise = "0.6.2"
rand = "0.10.1"
regex = "1.12.3"
scraper = { version = "0.27.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serenity = "0.12.5"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracker-gg = { version = "0.1.0", path = "../tracker-gg" }
uuid = { version = "1.23.1", features = ["serde"] }
vader-sentimental = { version = "0.1.3", optional = true }
wreq = { version = "5.3.0", features = ["json"] }
wreq-util = "2.2.6"

[features]
default = ["milk-truck"]
milk-truck = ["dep:vader-sentimental"]
